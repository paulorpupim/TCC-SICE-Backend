spring.application.name=sice

spring.profiles.default=dev

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sice}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postdba}
spring.datasource.driver-class-name=org.postgresql.Driver

security.jwt.secret=${JWT_SECRET:Q3p2cGh1S3hKWE5mU2xWZE5vQXpwUXJ2UGFvRHJGd1g=}
#Tempo em segundos que dura o token jwt
security.jwt.expiration-seconds=3600

bot.url=${BOT_URL:http://localhost:3000}
bot.secret=${BOT_SECRET:chave-teste}