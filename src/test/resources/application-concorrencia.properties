# Perfil exclusivo da prova de concorrencia. NAO utilizar banco real.
# A URL e FORCADA tambem por @DynamicPropertySource dentro do teste.
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/sice_concorrencia
spring.datasource.username=${CONCORRENCIA_DB_USERNAME:postgres}
spring.datasource.password=${CONCORRENCIA_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Apenas o banco totalmente descartavel sice_concorrencia recebe create-drop.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=6
logging.level.org.hibernate.SQL=WARN
logging.level.com.tccds.sice.modules.envio_aviso=INFO
